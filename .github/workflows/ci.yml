name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @template/vitest-config build
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
      - name: Run typecheck
        run: pnpm --filter api typecheck
      - name: Run API unit tests
        run: pnpm --filter api test:run
      - name: Run API integration tests
        run: pnpm --filter api test:integration

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @template/vitest-config build
      - name: Run typecheck
        run: pnpm --filter web typecheck
      - name: Run web tests
        run: pnpm --filter web test:run

  design-system-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @template/vitest-config build
      - name: Run typecheck
        run: pnpm --filter design-system typecheck
      - name: Run design system tests
        run: pnpm --filter design-system test:ci
