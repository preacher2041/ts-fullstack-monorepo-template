spec:
  contents:
    openapi: 3.0.0
    info:
      title: Fullstack Monorepo Template API
      version: 1.0.0
      description: Interactive API documentation for our Express backend REST endpoints.
      contact:
        name: Lee Hitchcock
        email: lee.hitchcock2041@gmail.com
    servers:
      - url: /api/v1
        description: Base API Endpoint
    tags:
      - name: Authentication
        description: Operations related to user login, logout, and session status.
      - name: Users
        description: Operations related to user registration, profile retrieval,
          updates, and deletion.
    components:
      schemas:
        LoginCredentials:
          type: object
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
          required:
            - email
            - password
        CreateUserInput:
          type: object
          properties:
            firstName:
              type: string
              minLength: 1
            lastName:
              type: string
              minLength: 1
            email:
              type: string
              format: email
            dob:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            username:
              type: string
              minLength: 1
            password:
              type: string
              minLength: 8
          required:
            - firstName
            - lastName
            - email
            - dob
            - username
            - password
        UpdateUserInput:
          type: object
          properties:
            firstName:
              type: string
              minLength: 1
            lastName:
              type: string
              minLength: 1
            email:
              type: string
              format: email
            dob:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            username:
              type: string
              minLength: 1
        UpdateUserPasswordInput:
          type: object
          properties:
            currentPassword:
              type: string
              minLength: 8
            newPassword:
              type: string
              minLength: 8
          required:
            - currentPassword
            - newPassword
        User:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            password:
              type: string
            username:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            dob:
              type: string
              nullable: true
              format: date-time
            createdAt:
              type: string
              nullable: true
              format: date-time
            updatedAt:
              type: string
              nullable: true
              format: date-time
          required:
            - id
            - email
            - password
            - username
            - firstName
            - lastName
            - dob
            - createdAt
            - updatedAt
        ErrorResponse:
          type: object
          properties:
            status:
              type: number
            message:
              type: string
          required:
            - status
            - message
    paths:
      /auth/login:
        post:
          operationId: login
          summary: Authenticate user
          description: Log in with email and password to establish a session.
          tags:
            - Authentication
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LoginCredentials"
          responses:
            "200":
              description: Login successful
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                      userId:
                        type: string
                        format: uuid
                    required:
                      - status
                      - message
                      - userId
            "401":
              description: Invalid credentials
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "404":
              description: User not found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
      /auth/logout:
        post:
          operationId: logout
          summary: Logout user
          description: Destroy the current user session and clear cookies.
          tags:
            - Authentication
          responses:
            "200":
              description: Logout successful
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                    required:
                      - status
                      - message
            "500":
              description: Internal server error during session cleanup
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
      /auth/session:
        get:
          operationId: getCurrentSession
          summary: Get session status
          description: Check if the request is authenticated and return basic details.
          tags:
            - Authentication
          responses:
            "200":
              description: Session status retrieved
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      authenticated:
                        type: boolean
                    required:
                      - authenticated
      /users:
        post:
          operationId: registerUser
          summary: Create user account
          description: Register a new user account with email and username.
          tags:
            - Users
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CreateUserInput"
          responses:
            "200":
              description: User created successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                      data:
                        $ref: "#/components/schemas/User"
                    required:
                      - status
                      - message
                      - data
            "400":
              description: Validation failed
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "409":
              description: User already exists
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
      /users/me:
        get:
          operationId: getCurrentUser
          summary: Get current user profile
          description: Fetch detailed profile information of the currently logged-in user.
          tags:
            - Users
          responses:
            "200":
              description: User profile retrieved successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                      user:
                        $ref: "#/components/schemas/User"
                    required:
                      - status
                      - message
                      - user
            "401":
              description: Unauthorized
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
      /users/{id}:
        put:
          operationId: updateUser
          summary: Update user profile
          description: Update the user profile information such as username and email.
          tags:
            - Users
          parameters:
            - schema:
                type: string
                format: uuid
              required: true
              name: id
              in: path
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UpdateUserInput"
          responses:
            "200":
              description: User updated successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                      data:
                        $ref: "#/components/schemas/User"
                    required:
                      - status
                      - message
                      - data
            "400":
              description: Validation failed
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "401":
              description: Unauthorized
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Forbidden - can only update own profile
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
        delete:
          operationId: deleteUser
          summary: Delete user account
          description: Permanently delete the user account from the database.
          tags:
            - Users
          parameters:
            - schema:
                type: string
                format: uuid
              required: true
              name: id
              in: path
          responses:
            "200":
              description: User deleted successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                    required:
                      - status
                      - message
            "401":
              description: Unauthorized
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Forbidden - can only delete own profile
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
      /users/{id}/password:
        patch:
          operationId: updateUserPassword
          summary: Update user password
          description: Change the current password to a new one.
          tags:
            - Users
          parameters:
            - schema:
                type: string
                format: uuid
              required: true
              name: id
              in: path
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UpdateUserPasswordInput"
          responses:
            "200":
              description: User updated successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: number
                        enum:
                          - 200
                      message:
                        type: string
                    required:
                      - status
                      - message
            "400":
              description: Validation failed
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "401":
              description: Incorrect current password
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Forbidden - can only update own password
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
  meta:
    id: spc_b690d8db2ad94810bff641a39a450c0b
    created: 1780089940965
    modified: 1780089940966
